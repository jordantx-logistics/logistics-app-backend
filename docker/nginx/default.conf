# Proxy hacia Octane (FrankenPHP). En Kubernetes este nginx se elimina y el
# Ingress/Service apunta directo a Octane.
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # Resolución de DNS de Docker en tiempo de petición (no falla si app aún arranca)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $octane http://app:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_pass $octane;
    }
}
