name: logistics-local

# Nota: NO se usa `env_file`. Laravel lee `.env` por su cuenta (Dotenv) y así
# respeta los valores que fija `phpunit.xml` en los tests (SQLite, colas sync,
# caché/sesión array). Inyectar `.env` como variables reales del proceso pisaría
# esa configuración.

services:
  app:
    build:
      context: .
    image: logistics-app-backend:local
    environment:
      APP_ROLE: web
      OCTANE_WORKERS: "${OCTANE_WORKERS:-2}"
      OCTANE_MAX_REQUESTS: "${OCTANE_MAX_REQUESTS:-500}"
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - logistics-network

  horizon:
    image: logistics-app-backend:local
    command: ["php", "artisan", "horizon"]
    restart: unless-stopped
    environment:
      APP_ROLE: horizon
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-network

  scheduler:
    image: logistics-app-backend:local
    environment:
      APP_ROLE: scheduler
    volumes:
      - .:/var/www
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logistics-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --sql-mode=STRICT_ALL_TABLES
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-logistics_app}
      MYSQL_USER: ${DB_USERNAME:-logistics}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - logistics-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - logistics-network

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - logistics-network

networks:
  logistics-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
