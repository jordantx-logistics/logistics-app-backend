openapi: 3.0.3
info:
  title: 'Logistics API Documentation'
  description: 'Documentación Oficial del API Backend (REST) para el Sistema Core de Logística. Incluye facturación, envíos, finanzas y autenticación.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nAPIs for managing sessions and access tokens (Sanctum)."
  -
    name: 'Customer - Companies'
    description: "\nAPIs for managing corporate customers."
  -
    name: 'Customer - Customers'
    description: "\nAPIs for managing the customer aggregate (sender/receiver of orders)."
  -
    name: 'Customer - Persons'
    description: "\nAPIs for managing individual customers."
  -
    name: 'Identity - Attendance'
    description: "\nAPIs para registrar, anular y consultar marcaciones de asistencia (UC-17/UC-18)."
  -
    name: 'Identity - Devices'
    description: "\nAPIs para listar y revocar dispositivos con token (UC-19)."
  -
    name: 'Identity - Employees'
    description: "\nAPIs para gestionar empleados de RRHH (UC-08/UC-09)."
  -
    name: 'Identity - Users'
    description: "\nAPIs para administrar usuarios, su estado y su ámbito de agencia (UC-01, UC-06, UC-07, UC-16)."
  -
    name: 'Logistics - Agency coverages'
    description: "\nQué ubicaciones atiende una agencia destino, con qué modalidad y con qué\nrecargo de reparto. `agency_id` es de `Organization` y se valida por puerto."
  -
    name: 'Logistics - Locations'
    description: "\nDistritos del padrón INEI (`ubigeo` de 6 dígitos). Se siembran con\n`UbigeoSeeder`; aquí se listan (paginado y filtrable) y se editan."
  -
    name: 'Logistics - Orders'
    description: "\nAPIs for managing core logistic orders."
  -
    name: 'Logistics - Tariffs'
    description: "\nTarifarios por servicio y alcance (nacional, par de zonas o par de\nubicaciones), con tramos por peso. Administración completa: `tariffs.manage`."
  -
    name: 'Logistics - Zones'
    description: "\nZonas de tarificación (agrupan ubicaciones). El seed crea una por\ndepartamento; el resto de la operación es edición."
  -
    name: 'Operations - Delivery'
    description: "\nLast-mile assignment, delivery and failure with evidence by route."
  -
    name: 'Operations - Embarks'
    description: "\nLoad manifests and disembark at destination/scale agencies."
  -
    name: 'Operations - Inventory'
    description: "\nPhysical inventory counts per agency."
  -
    name: 'Operations - Reception'
    description: "\nPhysical reception of parcels at the origin agency."
  -
    name: 'Operations - Shipments'
    description: "\nOperational state of every shipment (projection of `order.created`)."
  -
    name: 'Operations - Tracking'
    description: "\nPDA scan synchronization and shipment timeline."
  -
    name: 'Organization - Agencies'
    description: "\nAPIs for managing branch locations."
  -
    name: 'Permission - Permisos'
    description: "\nAPIs para gestionar permisos del sistema."
  -
    name: 'Permission - Roles'
    description: "\nAPIs para gestionar roles del sistema."
  -
    name: 'System - Health'
    description: "\nReadiness del servicio: comprueba base de datos, Redis y colas."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "Para probar los endpoints protegidos, utiliza las siguientes credenciales por defecto:\n\n**Email**: `admin@admin.pe`\n**Password**: `SecureAdmin2026!@#`\n\nEl token se genera automáticamente al hacer login con estas credenciales."
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Login (web)'
      operationId: loginweb
      description: "Authenticates against the session guard and sets the `HttpOnly` session\ncookie. Requires the CSRF cookie (`GET /sanctum/csrf-cookie`) first."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          email:
                            type: string
                      roles:
                        type: array
                        items:
                          type: string
                      permissions:
                        type: array
                        items:
                          type: string
                      agencies:
                        type: array
                        items:
                          type: integer
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                password:
                  type: string
                  description: ''
              required:
                - email
                - password
  /api/v1/auth/token:
    post:
      summary: 'Issue Token (apps / PDA)'
      operationId: issueTokenappsPDA
      description: "Returns an opaque token to send as `Authorization: Bearer <token>`.\nThe plain value is shown only once."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      token_type:
                        type: string
                      expires_in:
                        type: integer
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                password:
                  type: string
                  description: ''
                device_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                platform:
                  type: string
                  description: 'This field is required when <code>device_uuid</code> is present. Must not be greater than 50 characters.'
                  nullable: true
                device_uuid:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  nullable: true
                app_version:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  nullable: true
              required:
                - email
                - password
                - device_name
  /api/v1/auth/forgot-password:
    post:
      summary: 'Forgot Password'
      operationId: forgotPassword
      description: "Sends the reset link when the email exists. The answer is neutral on\npurpose: it never reveals whether the account exists."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
              required:
                - email
  /api/v1/auth/reset-password:
    post:
      summary: 'Reset Password'
      operationId: resetPassword
      description: "Consumes the token from the email and sets the new password. Revokes\nevery access token of the user.\n\n`password_confirmation` is required by the validation rules (`confirmed`)\nbut Scribe does not infer it from them, so it is declared by hand."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'Token received by email.'
                email:
                  type: string
                  description: 'Account email.'
                password:
                  type: string
                  description: 'New password (at least 8 characters).'
                password_confirmation:
                  type: string
                  description: 'Repeat of the new password.'
              required:
                - token
                - email
                - password
                - password_confirmation
  /api/v1/auth/me:
    get:
      summary: 'Current User'
      operationId: currentUser
      description: 'Returns the authenticated user with roles, permissions and agency scope.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          email:
                            type: string
                      roles:
                        type: array
                        items:
                          type: string
                      permissions:
                        type: array
                        items:
                          type: string
                      agencies:
                        type: array
                        items:
                          type: integer
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Revokes the current access token (apps) and closes the session (web).'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - Authentication
  /api/v1/auth/logout-all:
    post:
      summary: 'Logout All Devices'
      operationId: logoutAllDevices
      description: "Revokes every token of the user. A later request with a revoked token\nanswers 401."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - Authentication
  /api/v1/customer/companies:
    get:
      summary: 'List Corporate Customers'
      operationId: listCorporateCustomers
      description: 'Retrieves a list of all registered corporate clients.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        tax_id:
                          type: string
                        business_name:
                          type: string
                        trade_name:
                          type: string
                        address:
                          type: string
                        contact_email:
                          type: string
                        contact_phone:
                          type: string
                        created_at:
                          type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Companies'
    post:
      summary: 'Register Corporate Customer'
      operationId: registerCorporateCustomer
      description: "Creates a new company **and** its customer aggregate (`customers`), so it can be used\nas sender/receiver of an order. The RUC is validated (11 digits and check digit)\nin the use case, which answers with an `error_code`."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      tax_id:
                        type: string
                      business_name:
                        type: string
                      trade_name:
                        type: string
                      address:
                        type: string
                      contact_email:
                        type: string
                      contact_phone:
                        type: string
                      created_at:
                        type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Companies'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tax_id:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                business_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                trade_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  nullable: true
                address:
                  type: string
                  description: ''
                  nullable: true
                contact_email:
                  type: string
                  description: 'Must be a valid email address.'
                  nullable: true
                contact_phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  nullable: true
              required:
                - tax_id
                - business_name
  /api/v1/customers:
    get:
      summary: 'List Customers'
      operationId: listCustomers
      description: "Returns customers, newest first, paginated with `page` and `per_page` (max 100).\n`q` searches by display name, document number or email."
      parameters:
        -
          in: query
          name: q
          description: 'Search term (name, document or email).'
          required: false
          schema:
            type: string
            description: 'Search term (name, document or email).'
        -
          in: query
          name: customer_type
          description: 'Filter by type: person|company.'
          required: false
          schema:
            type: string
            description: 'Filter by type: person|company.'
        -
          in: query
          name: is_active
          description: 'Filter by active flag.'
          required: false
          schema:
            type: boolean
            description: 'Filter by active flag.'
        -
          in: query
          name: page
          description: 'Page to return.'
          required: false
          schema:
            type: integer
            description: 'Page to return.'
        -
          in: query
          name: per_page
          description: 'Rows per page (1..100, default 15).'
          required: false
          schema:
            type: integer
            description: 'Rows per page (1..100, default 15).'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        code:
                          type: string
                        customer_type:
                          type: string
                        person_id:
                          type: integer
                        company_id:
                          type: string
                          nullable: true
                        display_name:
                          type: string
                        document_type:
                          type: string
                        document_number:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                        address:
                          type: string
                          nullable: true
                        is_active:
                          type: boolean
                        credit_limit:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                        updated_at:
                          type: string
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      from:
                        type: integer
                      last_page:
                        type: integer
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              nullable: true
                            label:
                              type: string
                            page:
                              type: string
                              nullable: true
                            active:
                              type: boolean
                      path:
                        type: string
                      per_page:
                        type: integer
                      to:
                        type: integer
                      total:
                        type: integer
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Customers'
    post:
      summary: 'Register Customer'
      operationId: registerCustomer
      description: "Creates the customer aggregate and its backing person or company in one transaction.\nThe document is unique per type and validated (RUC check digit included)."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      code:
                        type: string
                      customer_type:
                        type: string
                      person_id:
                        type: integer
                      company_id:
                        type: string
                        nullable: true
                      display_name:
                        type: string
                      document_type:
                        type: string
                      document_number:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      address:
                        type: string
                        nullable: true
                      is_active:
                        type: boolean
                      credit_limit:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                      updated_at:
                        type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Customers'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_type:
                  type: string
                  description: ''
                  enum:
                    - person
                    - company
                document_type:
                  type: string
                  description: 'Must not be greater than 10 characters.'
                document_number:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                display_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  nullable: true
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  nullable: true
                phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  nullable: true
                address:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  nullable: true
                credit_limit:
                  type: number
                  description: 'Must be at least 0.'
                  nullable: true
                first_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                last_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                business_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                trade_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  nullable: true
                contact_email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  nullable: true
                contact_phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  nullable: true
              required:
                - customer_type
                - document_type
                - document_number
                - business_name
  '/api/v1/customers/{id}':
    get:
      summary: 'Show Customer'
      operationId: showCustomer
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      code:
                        type: string
                      customer_type:
                        type: string
                      person_id:
                        type: integer
                      company_id:
                        type: string
                        nullable: true
                      display_name:
                        type: string
                      document_type:
                        type: string
                      document_number:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      address:
                        type: string
                        nullable: true
                      is_active:
                        type: boolean
                      credit_limit:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                      updated_at:
                        type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Customers'
    put:
      summary: 'Update Customer'
      operationId: updateCustomer
      description: 'Updates contact data and the backing person/company. The document cannot be changed.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      code:
                        type: string
                      customer_type:
                        type: string
                      person_id:
                        type: integer
                      company_id:
                        type: string
                        nullable: true
                      display_name:
                        type: string
                      document_type:
                        type: string
                      document_number:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      address:
                        type: string
                        nullable: true
                      is_active:
                        type: boolean
                      credit_limit:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                      updated_at:
                        type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Customers'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  nullable: true
                phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  nullable: true
                address:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  nullable: true
                credit_limit:
                  type: number
                  description: 'Must be at least 0.'
                  nullable: true
                first_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                last_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                business_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                trade_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  nullable: true
                contact_email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  nullable: true
                contact_phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  nullable: true
    delete:
      summary: 'Deactivate Customer'
      operationId: deactivateCustomer
      description: "Soft-style deletion: sets `is_active = false`. Rejected with 409 while the\ncustomer has pending, confirmed or in-transit orders."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      code:
                        type: string
                      customer_type:
                        type: string
                      person_id:
                        type: integer
                      company_id:
                        type: string
                        nullable: true
                      display_name:
                        type: string
                      document_type:
                        type: string
                      document_number:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      address:
                        type: string
                        nullable: true
                      is_active:
                        type: boolean
                      credit_limit:
                        type: string
                        nullable: true
                      created_at:
                        type: string
                      updated_at:
                        type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Customers'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the customer.'
        required: true
        schema:
          type: integer
  /api/v1/customer/persons:
    get:
      summary: 'List Individual Customers'
      operationId: listIndividualCustomers
      description: 'Retrieves a list of all registered individual clients.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        document_type:
                          type: string
                        document_number:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                        created_at:
                          type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Persons'
    post:
      summary: 'Register Individual Customer'
      operationId: registerIndividualCustomer
      description: "Creates a new person **and** its customer aggregate (`customers`), so the person can\nbe used as sender/receiver of an order. Business rules (document format and\nuniqueness) run in the use case and answer with an `error_code`."
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      document_type:
                        type: string
                      document_number:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      created_at:
                        type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Persons'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_type:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                document_number:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                first_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                last_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  nullable: true
                phone:
