openapi: 3.0.3
info:
  title: 'Logistics API Documentation'
  description: 'Documentación Oficial del API Backend (REST) para el Sistema Core de Logística. Incluye facturación, envíos, finanzas y autenticación.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nAPIs for managing sessions and access tokens (Sanctum)."
  -
    name: 'Customer - Companies'
    description: "\nAPIs for managing corporate customers."
  -
    name: 'Customer - Persons'
    description: "\nAPIs for managing individual customers."
  -
    name: 'Identity - Attendance'
    description: "\nAPIs para registrar, anular y consultar marcaciones de asistencia (UC-17/UC-18)."
  -
    name: 'Identity - Devices'
    description: "\nAPIs para listar y revocar dispositivos con token (UC-19)."
  -
    name: 'Identity - Employees'
    description: "\nAPIs para gestionar empleados de RRHH (UC-08/UC-09)."
  -
    name: 'Identity - Users'
    description: "\nAPIs para administrar usuarios, su estado y su ámbito de agencia (UC-01, UC-06, UC-07, UC-16)."
  -
    name: 'Logistics - Orders'
    description: "\nAPIs for managing core logistic orders."
  -
    name: 'Organization - Agencies'
    description: "\nAPIs for managing branch locations."
  -
    name: 'Permission - Permisos'
    description: "\nAPIs para gestionar permisos del sistema."
  -
    name: 'Permission - Roles'
    description: "\nAPIs para gestionar roles del sistema."
  -
    name: 'System - Health'
    description: "\nReadiness del servicio: comprueba base de datos, Redis y colas."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "Para probar los endpoints protegidos, utiliza las siguientes credenciales por defecto:\n\n**Email**: `admin@admin.pe`\n**Password**: `SecureAdmin2026!@#`\n\nEl token se genera automáticamente al hacer login con estas credenciales."
security:
  -
    default: []
paths:
  /api/v1/auth/login:
    post:
      summary: 'Login (web)'
      operationId: loginweb
      description: "Authenticates against the session guard and sets the `HttpOnly` session\ncookie. Requires the CSRF cookie (`GET /sanctum/csrf-cookie`) first."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          email:
                            type: string
                      roles:
                        type: array
                        items:
                          type: string
                      permissions:
                        type: array
                        items:
                          type: string
                      agencies:
                        type: array
                        items:
                          type: integer
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                password:
                  type: string
                  description: ''
              required:
                - email
                - password
  /api/v1/auth/token:
    post:
      summary: 'Issue Token (apps / PDA)'
      operationId: issueTokenappsPDA
      description: "Returns an opaque token to send as `Authorization: Bearer <token>`.\nThe plain value is shown only once."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      token_type:
                        type: string
                      expires_in:
                        type: integer
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                password:
                  type: string
                  description: ''
                device_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                platform:
                  type: string
                  description: 'This field is required when <code>device_uuid</code> is present. Must not be greater than 50 characters.'
                  nullable: true
                device_uuid:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  nullable: true
                app_version:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  nullable: true
              required:
                - email
                - password
                - device_name
  /api/v1/auth/forgot-password:
    post:
      summary: 'Forgot Password'
      operationId: forgotPassword
      description: "Sends the reset link when the email exists. The answer is neutral on\npurpose: it never reveals whether the account exists."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
              required:
                - email
  /api/v1/auth/reset-password:
    post:
      summary: 'Reset Password'
      operationId: resetPassword
      description: "Consumes the token from the email and sets the new password. Revokes\nevery access token of the user.\n\n`password_confirmation` is required by the validation rules (`confirmed`)\nbut Scribe does not infer it from them, so it is declared by hand."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 'Token received by email.'
                email:
                  type: string
                  description: 'Account email.'
                password:
                  type: string
                  description: 'New password (at least 8 characters).'
                password_confirmation:
                  type: string
                  description: 'Repeat of the new password.'
              required:
                - token
                - email
                - password
                - password_confirmation
  /api/v1/auth/me:
    get:
      summary: 'Current User'
      operationId: currentUser
      description: 'Returns the authenticated user with roles, permissions and agency scope.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                          email:
                            type: string
                      roles:
                        type: array
                        items:
                          type: string
                      permissions:
                        type: array
                        items:
                          type: string
                      agencies:
                        type: array
                        items:
                          type: integer
      tags:
        - Authentication
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Revokes the current access token (apps) and closes the session (web).'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - Authentication
  /api/v1/auth/logout-all:
    post:
      summary: 'Logout All Devices'
      operationId: logoutAllDevices
      description: "Revokes every token of the user. A later request with a revoked token\nanswers 401."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - Authentication
  /api/v1/customer/companies:
    get:
      summary: 'List Corporate Customers'
      operationId: listCorporateCustomers
      description: 'Retrieves a list of all registered corporate clients.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        tax_id:
                          type: string
                        business_name:
                          type: string
                        trade_name:
                          type: string
                        address:
                          type: string
                        contact_email:
                          type: string
                        contact_phone:
                          type: string
                        created_at:
                          type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Companies'
    post:
      summary: 'Register Corporate Customer'
      operationId: registerCorporateCustomer
      description: 'Creates a new company record, typically requiring RUC formatting and business names.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      tax_id:
                        type: string
                      business_name:
                        type: string
                      trade_name:
                        type: string
                      address:
                        type: string
                      contact_email:
                        type: string
                      contact_phone:
                        type: string
                      created_at:
                        type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Companies'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tax_id:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                business_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                trade_name:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  nullable: true
                address:
                  type: string
                  description: ''
                  nullable: true
                contact_email:
                  type: string
                  description: 'Must be a valid email address.'
                  nullable: true
                contact_phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  nullable: true
              required:
                - tax_id
                - business_name
  /api/v1/customer/persons:
    get:
      summary: 'List Individual Customers'
      operationId: listIndividualCustomers
      description: 'Retrieves a list of all registered individual clients.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        document_type:
                          type: string
                        document_number:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                        created_at:
                          type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Persons'
    post:
      summary: 'Register Individual Customer'
      operationId: registerIndividualCustomer
      description: 'Creates a new person record in the database using their personal document (e.g. DNI).'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      document_type:
                        type: string
                      document_number:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      created_at:
                        type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Customer - Persons'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document_type:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                document_number:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                first_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                last_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  nullable: true
                phone:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  nullable: true
              required:
                - document_type
                - document_number
                - first_name
                - last_name
  /api/v1/identity/attendance:
    get:
      summary: 'List Attendance'
      operationId: listAttendance
      description: 'Lista las marcaciones visibles para el usuario, filtrables por empleado, agencia, estado y rango de fechas.'
      parameters:
        -
          in: query
          name: employee_id
          description: 'Filtra por empleado.'
          required: false
          schema:
            type: integer
            description: 'Filtra por empleado.'
        -
          in: query
          name: agency_id
          description: 'Filtra por agencia.'
          required: false
          schema:
            type: integer
            description: 'Filtra por agencia.'
        -
          in: query
          name: status
          description: 'valid,late,duplicate,voided.'
          required: false
          schema:
            type: string
            description: 'valid,late,duplicate,voided.'
        -
          in: query
          name: from
          description: 'Fecha ISO-8601 inferior (inclusive).'
          required: false
          schema:
            type: string
            description: 'Fecha ISO-8601 inferior (inclusive).'
        -
          in: query
          name: to
          description: 'Fecha ISO-8601 superior (inclusive).'
          required: false
          schema:
            type: string
            description: 'Fecha ISO-8601 superior (inclusive).'
        -
          in: query
          name: per_page
          description: 'Rows per page (1..100, por defecto 15).'
          required: false
          schema:
            type: integer
            description: 'Rows per page (1..100, por defecto 15).'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        employee_id:
                          type: integer
                        agency_id:
                          type: integer
                        type:
                          type: string
                        marked_at:
                          type: string
                        source:
                          type: string
                        device_id:
                          type: string
                          nullable: true
                        latitude:
                          type: string
                          nullable: true
                        longitude:
                          type: string
                          nullable: true
                        ip_address:
                          type: string
                        status:
                          type: string
                        idempotency_key:
                          type: string
                        created_at:
                          type: string
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      from:
                        type: integer
                      last_page:
                        type: integer
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              nullable: true
                            label:
                              type: string
                            page:
                              type: string
                              nullable: true
                            active:
                              type: boolean
                      path:
                        type: string
                      per_page:
                        type: integer
                      to:
                        type: integer
                      total:
                        type: integer
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Identity - Attendance'
    post:
      summary: 'Register Attendance'
      operationId: registerAttendance
      description: 'Registra una marcación de entrada/salida de un empleado. Es idempotente por `idempotency_key`, por lo que los reintentos offline no duplican registros.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      employee_id:
                        type: integer
                      agency_id:
                        type: integer
                      type:
                        type: string
                      marked_at:
                        type: string
                      source:
                        type: string
                      device_id:
                        type: string
                        nullable: true
                      latitude:
                        type: string
                        nullable: true
                      longitude:
                        type: string
                        nullable: true
                      ip_address:
                        type: string
                      status:
                        type: string
                      idempotency_key:
                        type: string
                      created_at:
                        type: string
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Identity - Attendance'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_id:
                  type: integer
                  description: 'Must be at least 1.'
                agency_id:
                  type: integer
                  description: 'Must be at least 1.'
                type:
                  type: string
                  description: ''
                  enum:
                    - in
                    - out
                    - break-start
                    - break-end
                marked_at:
                  type: string
                  description: 'Must be a valid date.'
                  nullable: true
                source:
                  type: string
                  description: ''
                  enum:
                    - web
                    - app
                    - pda
                    - biometric
                  nullable: true
                device_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the devices table.'
                  nullable: true
                latitude:
                  type: number
                  description: 'Must be between -90 and 90.'
                  nullable: true
                longitude:
                  type: number
                  description: 'Must be between -180 and 180.'
                  nullable: true
                idempotency_key:
                  type: string
                  description: 'Must not be greater than 64 characters.'
              required:
                - employee_id
                - agency_id
                - type
                - idempotency_key
  /api/v1/identity/attendance/summary:
    get:
      summary: 'Attendance Summary'
      operationId: attendanceSummary
      description: 'Consolidado diario por empleado (`attendance_days`), filtrable por empleado y rango de fechas.'
      parameters:
        -
          in: query
          name: employee_id
          description: 'Filtra por empleado.'
          required: false
          schema:
            type: integer
            description: 'Filtra por empleado.'
        -
          in: query
          name: from
          description: 'Fecha inferior (inclusive).'
          required: false
          schema:
            type: string
            description: 'Fecha inferior (inclusive).'
        -
          in: query
          name: to
          description: 'Fecha superior (inclusive).'
          required: false
          schema:
            type: string
            description: 'Fecha superior (inclusive).'
        -
          in: query
          name: per_page
          description: 'Rows per page (1..100, por defecto 15).'
          required: false
          schema:
            type: integer
            description: 'Rows per page (1..100, por defecto 15).'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        employee_id:
                          type: integer
                        work_date:
                          type: string
                        first_in_at:
                          type: string
                        last_out_at:
                          type: string
                        worked_minutes:
                          type: integer
                        late_minutes:
                          type: integer
                        status:
                          type: string
      tags:
        - 'Identity - Attendance'
  '/api/v1/identity/attendance/{attendance_id}/void':
    post:
      summary: 'Void Attendance'
      operationId: voidAttendance
      description: 'Anula una marcación (RRHH). El consolidado del día se recalcula sin ella.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - 'Identity - Attendance'
    parameters:
      -
        in: path
        name: attendance_id
        description: 'The ID of the attendance.'
        required: true
        schema:
          type: integer
  /api/v1/identity/devices:
    get:
      summary: 'List Devices'
      operationId: listDevices
      description: 'Lista los dispositivos del usuario (o los de otro usuario con `user_id` si se tiene `devices.manage`).'
      parameters:
        -
          in: query
          name: user_id
          description: 'Dispositivos de otro usuario (requiere `devices.manage`).'
          required: false
          schema:
            type: integer
            description: 'Dispositivos de otro usuario (requiere `devices.manage`).'
        -
          in: query
          name: status
          description: 'active,revoked.'
          required: false
          schema:
            type: string
            description: 'active,revoked.'
        -
          in: query
          name: per_page
          description: 'Rows per page (1..100, por defecto 15).'
          required: false
          schema:
            type: integer
            description: 'Rows per page (1..100, por defecto 15).'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: integer
                        device_name:
                          type: string
                        platform:
                          type: string
                        device_uuid:
                          type: string
                        app_version:
                          type: string
                        status:
                          type: string
                        last_seen_at:
                          type: string
                        revoked_at:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: string
                        nullable: true
                      next:
                        type: string
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      from:
                        type: integer
                      last_page:
                        type: integer
                      links:
                        type: array
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              nullable: true
                            label:
                              type: string
                            page:
                              type: string
                              nullable: true
                            active:
                              type: boolean
                      path:
                        type: string
                      per_page:
                        type: integer
                      to:
                        type: integer
                      total:
                        type: integer
                  success:
                    type: string
                  message:
                    type: string
      tags:
        - 'Identity - Devices'
  '/api/v1/identity/devices/{device_id}':
    delete:
      summary: 'Revoke Device'
      operationId: revokeDevice
      description: 'Revoca el dispositivo y sus tokens: la siguiente petición con ese token responde `401`.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
      tags:
        - 'Identity - Devices'
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        required: true
        schema:
          type: integer
  /api/v1/identity/employees:
    get:
      summary: 'List Employees'
      operationId: listEmployees
      description: 'Lista los empleados visibles para el usuario, filtrables por estado, agencia y texto.'
      parameters:
        -
          in: query
          name: status
          description: 'active,on_leave,terminated.'
          required: false
          schema:
            type: string
            description: 'active,on_leave,terminated.'
        -
          in: query
          name: agency_id
          description: 'Agencia base.'
          required: false
          schema:
            type: integer
            description: 'Agencia base.'
        -
          in: query
          name: q
          description: 'Busca por documento o nombre.'
          required: false
          schema:
            type: string
            description: 'Busca por documento o nombre.'
        -
          in: query
          name: per_page
          description: 'Rows per page (1..100, por defecto 15).'
          required: false
          schema:
            type: integer
