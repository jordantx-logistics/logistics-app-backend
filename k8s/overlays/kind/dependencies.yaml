# Sustitutos de Managed MySQL y Managed Redis. Sin réplica: el enrutamiento ya se comprueba
# en `docker-compose.scale.yml`; aquí importa cómo se comportan los pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels: { role: dependency, dep: mysql }
spec:
  replicas: 1
  selector:
    matchLabels: { dep: mysql }
  template:
    metadata:
      labels: { role: dependency, dep: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --default-authentication-plugin=mysql_native_password
            - --sql-mode=STRICT_ALL_TABLES
            - --innodb-flush-log-at-trx-commit=2
          env:
            - { name: MYSQL_DATABASE, value: logistics_app }
            - { name: MYSQL_USER, value: logistics }
            - { name: MYSQL_PASSWORD, value: secret }
            - { name: MYSQL_ROOT_PASSWORD, value: root }
          ports:
            - { name: mysql, containerPort: 3306 }
          readinessProbe:
            exec: { command: ["mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"] }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap: { name: mysql-init }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  users.sql: |
    CREATE USER IF NOT EXISTS 'logistics_read'@'%' IDENTIFIED WITH mysql_native_password BY 'read-local';
    GRANT SELECT ON logistics_app.* TO 'logistics_read'@'%';
    CREATE USER IF NOT EXISTS 'proxysql_monitor'@'%' IDENTIFIED WITH mysql_native_password BY 'monitor-local';
    GRANT REPLICATION CLIENT ON *.* TO 'proxysql_monitor'@'%';
    ALTER USER 'logistics'@'%' IDENTIFIED WITH mysql_native_password BY 'secret';
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: { dep: mysql }
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { role: dependency, dep: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { dep: redis }
  template:
    metadata:
      labels: { role: dependency, dep: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { dep: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
# La política por defecto prohíbe todo lo entrante: abre las dependencias de prueba.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dependencies-ingress
spec:
  podSelector:
    matchLabels: { role: dependency }
  policyTypes: [Ingress]
  ingress:
    - {}
---
# Para que la prueba llegue a `web` desde dentro del namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-namespace
spec:
  podSelector:
    matchLabels: { app: web }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - { port: 8000 }
