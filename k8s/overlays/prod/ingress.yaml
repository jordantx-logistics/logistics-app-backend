apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    # Certificado Origin CA de Cloudflare (`07-devops/05-cloudflare.md`).
    - hosts: [api.logistica.pe]
      secretName: origin-tls
  rules:
    - host: api.logistica.pe
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 8000 } }
