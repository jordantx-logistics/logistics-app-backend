apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Lo común a todos los entornos. Cada overlay fija la imagen, las réplicas, el host y los
# servicios gestionados. Los Secrets no están aquí: los inyecta el gestor de secretos.
resources:
  - configmap.yaml
  - web.yaml
  - horizon.yaml
  - outbox.yaml
  - cronjobs.yaml
  - migrate-job.yaml
  - proxysql.yaml
  - networkpolicy.yaml
