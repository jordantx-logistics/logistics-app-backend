name: CI

# Regla de ramas (ADR-0010): nada llega a `develop` (staging) ni a `main`
# (producción) sin pasar por aquí.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # La imagen que construye el CI, y que `docker-compose.yml` usa en sus
  # servicios (`image: ${APP_IMAGE:-logistics-app-backend:local}`).
  APP_IMAGE: logistics-app-backend:ci

jobs:
  backend:
    name: Calidad y contrato
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      # El backend se ejecuta solo con Docker: la imagen es el artefacto que se
      # despliega, y cada paso corre dentro de ella (el runner no instala PHP).
      - name: Construir la imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.APP_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Los pasos que no necesitan servicios usan `run --no-deps`, así que
      # MySQL/Redis no se levantan hasta que hacen falta.
      - name: Dependencias y entorno
        run: |
          docker compose run --rm --no-deps app sh -c '
            set -e
            composer install --no-interaction --prefer-dist --no-progress
            [ -f .env ] || cp .env.example .env
            php artisan key:generate --force
          '

      - name: Validar docker-compose
        run: docker compose config --quiet

      - name: Estilo (Pint)
        run: docker compose run --rm --no-deps app ./vendor/bin/pint --test

      # La suite va con SQLite en memoria (`phpunit.xml`) y sin red: los tests no
      # dependen de MySQL/Redis, así que si alguno lo hiciera se vería aquí.
      # Se usa `docker run` (y no `compose run`) porque hace falta `--network none`.
      - name: Tests (Pest)
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE":/var/www "$APP_IMAGE" sh -c 'php artisan test'

      # Criterios 9 de Fase 3, 4 y 5. Pcov solo se activa en este paso (no penaliza
      # la suite normal) y el script aplica los umbrales por dominio: `src/`
      # >= 80 %, el motor de precios al 100 % de líneas, `src/Operations/` y
      # `src/Finance/` >= 80 %, y los casos de uso de caja y anulación al 100 %.
      # Pcov no mide ramas; esos 100 % se complementan con sus matrices de tests.
      - name: Cobertura
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE":/var/www "$APP_IMAGE" sh -c '
            set -e
            php -d pcov.enabled=1 -d pcov.directory=src artisan test --coverage-clover build/coverage.xml
            php scripts/coverage-check.php build/coverage.xml
            chmod -R a+rX build
          '

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage.xml
          if-no-files-found: ignore

      # MySQL es el motor real: las migraciones y los seeders se validan contra
      # él y no solo contra SQLite. Se levantan **los mismos servicios que en
      # local** (mismas versiones) para que los hostnames `mysql` y `redis` del
      # `.env` resuelvan: la migración de spatie/laravel-permission vacía su
      # caché de permisos, así que `migrate` necesita el almacén de caché vivo.
      - name: Levantar MySQL y Redis
        run: docker compose up -d --wait mysql redis

      - name: Migraciones y seeders sobre MySQL
        run: docker compose run --rm app php artisan migrate --seed --force

      # Criterio 2 de la Fase 5 y reglas de recursos de la Fase 6. SQLite en memoria
      # no tiene conexiones concurrentes ni bloqueos de fila: procesos reales operan
      # a la vez contra un MySQL desechable. Corre aparte de `mysql`, porque recrea
      # su base.
      - name: Concurrencia sobre MySQL
        run: |
          docker compose --profile concurrency up -d --wait mysql-concurrency
          for check in finance fleet; do
            docker compose run --rm --no-deps \
              -e DB_HOST=mysql-concurrency -e DB_DATABASE=logistics_concurrency \
              -e DB_USERNAME=root -e DB_PASSWORD=root \
              app php "scripts/$check-concurrency-check.php"
          done

      # El runner publica el artefacto como usuario sin privilegios, y Scribe
      # crea `storage/app/private/scribe` con la visibilidad **privada** del
      # disco `local` de Laravel (0700, root): sin ese `chmod`, el paso de
      # publicación no puede ni leer el contrato (`EACCES` en el `lstat`).
      - name: Generar el contrato OpenAPI
        run: |
          docker compose run --rm app sh -c '
            php artisan scribe:generate
            chmod -R a+rX storage/app/private/scribe
          '

      # Criterio 10 de la Fase 1: el contrato vive **versionado** en
      # `openapi/openapi.yaml`. `contract-sync.php` normaliza el spec (elimina
      # las claves `example`/`examples`, que trae Faker volátil: ids medidos en
      # la BD, timestamps de `now()`, latencias) y `git diff` falla la build si
      # Scribe ya no produce lo mismo que está commiteado — o sea, si alguien
      # tocó docblocks o rutas sin actualizar la copia.
      - name: Contrato versionado sin deriva
        run: |
          docker compose run --rm app php scripts/contract-sync.php
          git diff --exit-code -- openapi/ || {
            echo "::error::El contrato OpenAPI cambió sin actualizar la copia versionada. Ejecuta 'php artisan scribe:generate' + 'php scripts/contract-sync.php' y commitea 'openapi/'."
            exit 1
          }

      # ADR-0008: el contrato OpenAPI viaja como artefacto del build (copy de
      # consulta: la fuente canónica con la que genera el frontend es la copia
      # versionada `openapi/openapi.yaml`).
      - name: Publicar el contrato
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: storage/app/private/scribe/openapi.yaml
          if-no-files-found: error

  # La imagen de producción no lleva dependencias de desarrollo: si algo las necesita al
  # arrancar, solo se ve construyéndola y levantándola de verdad.
  production-image:
    name: Imagen de producción
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          load: true
          tags: logistics-app-backend:production
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Arranca como usuario sin privilegios
        run: |
          docker run -d --name web \
            -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" \
            -e LOG_CHANNEL=stderr -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            -e METRICS_STORAGE=in-memory -e OCTANE_WORKERS=1 \
            logistics-app-backend:production
          for attempt in $(seq 1 30); do
            if docker exec web sh -c 'wget -qO- http://127.0.0.1:8000/up > /dev/null'; then
              test "$(docker exec web id -u)" = 10001
              exit 0
            fi
            sleep 2
          done
          docker logs web
          exit 1

  # Primary, réplica y ProxySQL de verdad: SQLite no replica ni particiona.
  scale:
    name: Réplica y particiones
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencias y entorno
        run: |
          docker compose build app
          docker compose run --rm --no-deps app sh -c '
            set -e
            composer install --no-interaction --prefer-dist --no-progress
            [ -f .env ] || cp .env.example .env
            php artisan key:generate --force
          '

      - name: Levantar el stack de escala
        run: sh scripts/scale-up.sh

      - name: Enrutamiento de lectura y escritura
        run: docker compose -f docker-compose.yml -f docker-compose.scale.yml --profile tools run --rm tools php scripts/replica-routing-check.php

      - name: Particiones, purga y cambio de tabla
        run: docker compose -f docker-compose.yml -f docker-compose.scale.yml --profile tools run --rm tools php scripts/partition-check.php

      # Criterio 10 de la Fase 9. No en local: satura un equipo de desarrollo.
      - name: Corte de Redis con carga
        run: sh scripts/redis-failover-check.sh

  # Criterios 5 y 8 de la Fase 9, sobre un clúster real. No en local, por el mismo motivo.
  kubernetes:
    name: Clúster kind
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen de producción
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          load: true
          tags: logistics-app-backend:production
          cache-from: type=gha,scope=production

      - name: Instalar kind
        run: |
          curl -fsSL -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.27.0/kind-linux-amd64
          sudo install kind /usr/local/bin/kind

      - name: Comprobar el clúster
        run: bash scripts/kind-check.sh

  infrastructure:
    name: Manifiestos y Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Manifiestos de Kubernetes
        run: |
          for overlay in kind staging prod; do
            kubectl kustomize "k8s/overlays/$overlay" > "$overlay.yaml"
            docker run --rm -v "$PWD:/w" -w /w ghcr.io/yannh/kubeconform:v0.6.7 \
              -strict -summary -kubernetes-version 1.31.0 "$overlay.yaml"
          done

      - name: Terraform
        run: |
          terraform() { docker run --rm -v "$PWD:/w" -w "/w/$1" hashicorp/terraform:1.9.8 "${@:2}"; }
          terraform infra/terraform fmt -check -recursive
          for env in staging prod; do
            terraform "infra/terraform/envs/$env" init -backend=false -input=false
            terraform "infra/terraform/envs/$env" validate
          done
