name: CI

# Regla de ramas (ADR-0010): nada llega a `develop` (staging) ni a `main`
# (producción) sin pasar por aquí.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: logistics-app-backend:ci

jobs:
  backend:
    name: Calidad y contrato
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: logistics_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@v3

      # El backend se ejecuta solo con Docker: la imagen es el artefacto que se
      # despliega, y cada paso corre dentro de ella (el runner no instala PHP).
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dependencias y entorno
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/var/www "$IMAGE" sh -c '
            set -e
            composer install --no-interaction --prefer-dist --no-progress
            [ -f .env ] || cp .env.example .env
            php artisan key:generate --force
            php artisan jwt:secret --force
          '

      - name: Validar docker-compose
        run: docker compose config --quiet

      - name: Estilo (Pint)
        run: docker run --rm -v "$GITHUB_WORKSPACE":/var/www "$IMAGE" sh -c './vendor/bin/pint --test'

      # La suite va con SQLite en memoria (`phpunit.xml`) y sin red: los tests no
      # dependen de MySQL/Redis, así que si alguno lo hiciera se vería aquí.
      - name: Tests (Pest)
        run: docker run --rm --network none -v "$GITHUB_WORKSPACE":/var/www "$IMAGE" sh -c 'php artisan test'

      # MySQL es el motor real: las migraciones y los seeders se validan contra
      # él y no solo contra SQLite.
      - name: Migraciones y seeders sobre MySQL
        run: |
          docker run --rm --network host -v "$GITHUB_WORKSPACE":/var/www \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE=logistics_ci \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=root \
            "$IMAGE" sh -c 'php artisan migrate --seed --force'

      - name: Generar el contrato OpenAPI
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/var/www \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/var/www/database/database.sqlite \
            -e CACHE_STORE=array \
            -e SESSION_DRIVER=array \
            -e QUEUE_CONNECTION=sync \
            "$IMAGE" sh -c 'touch database/database.sqlite && php artisan migrate --seed --force && php artisan scribe:generate'

      # ADR-0008: el contrato OpenAPI viaja como artefacto del build y de ahí lo
      # consume el frontend para generar sus tipos (Fase 1).
      - name: Publicar el contrato
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: storage/app/private/scribe/openapi.yaml
          if-no-files-found: error
